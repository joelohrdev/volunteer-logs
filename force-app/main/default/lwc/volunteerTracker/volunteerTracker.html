<template>
    <lightning-card title="Volunteer Hours">
        <div class="slds-var-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <lightning-input label="Date" type="date" value={activityDate} onchange={handleDate}></lightning-input>
            <lightning-input label="Hours" type="number" step="0.5" value={hours} onchange={handleHours}></lightning-input>
            <lightning-input label="Notes" value={notes} onchange={handleNotes}></lightning-input>
            <lightning-button
                label="Add Log"
                onclick={handleSubmit}
                disabled={isSubmitting}
                class="slds-var-m-top_small">
            </lightning-button>

            <template if:true={hasLogs}>
                <template for:each={logs} for:item="log">
                    <p key={log.Id}>{log.Activity_Date__c} - {log.Hours__c} hrs - {log.Notes__c}</p>
                </template>
            </template>
            <template if:false={hasLogs}>
                <p class="slds-text-color_weak slds-var-m-top_medium">No logs yet</p>
            </template>
        </div>
    </lightning-card>
</template>
